<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pakistan Land Area Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
        color: #222;
        transition: 0.3s;
    }
    body.dark {
        background: #1e1e1e;
        color: #eee;
    }
    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    body.dark .card {
        background: #2b2b2b;
        box-shadow: 0 4px 10px rgba(255,255,255,0.1);
    }
    input, select, button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    button {
        background: #0077ff;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background: #005fcc;
    }
    .row {
        display: flex;
        gap: 10px;
    }
    .row > div {
        flex: 1;
    }
    @media print {
        button, select {
            display: none !important;
        }
        body {
            background: white;
            color: black;
        }
    }
</style>
</head>
<body>

<div class="container">
<h1>Pakistan Land Area Calculator</h1>
<button onclick="toggleTheme()">Toggle Dark / Light Mode</button>

<!---------------- LENGTH × WIDTH CALCULATOR ---------------->
<div class="card">
<h2>Area by Length × Width (Feet)</h2>
<div class="row">
    <div><input type="number" id="len" placeholder="Length (ft)"></div>
    <div><input type="number" id="wid" placeholder="Width (ft)"></div>
</div>
<button onclick="calcByDimensions()">Calculate</button>
<div id="dimResult"></div>
</div>

<!---------------- FT TO OTHER UNITS ---------------->
<div class="card">
<h2>Convert From Square Feet</h2>
<input type="number" id="sqft" placeholder="Enter Area in Square Feet" />
<button onclick="convertFromSqFt()">Convert</button>
<div id="ftResult"></div>
</div>

<!---------------- REVERSE CALC ---------------->
<div class="card">
<h2>Reverse Conversion</h2>
<select id="unitType">
    <option value="marla_pk">Marla (Pakistan)</option>
    <option value="sarsai">Sarsai</option>
    <option value="kanal">Kanal</option>
    <option value="acre">Acre</option>
    <option value="hectare">Hectare</option>
    <option value="donum">Donum</option>
</select>
<input type="number" id="unitValue" placeholder="Enter Value" />
<button onclick="reverseConvert()">Convert</button>
<div id="revResult"></div>
</div>
</div>

<script>
function toggleTheme(){
    document.body.classList.toggle('dark');
}

// Pakistan Standard Units
const PK_MARLA = 272.25;
const SARSAI = 30.25;
const KANAL = PK_MARLA * 20;
const ACRE = 43560;
const HECTARE = 107639;
const DONUM = 27225;

function calcByDimensions(){
    let L = parseFloat(document.getElementById("len").value);
    let W = parseFloat(document.getElementById("wid").value);
    if (!L || !W) return;
    let area = L * W;
    document.getElementById("dimResult").innerHTML = `<b>Total Area:</b> ${area} sq ft`;
}

function convertFromSqFt(){
    let ft = parseFloat(document.getElementById("sqft").value);
    if (!ft) return;

    let kanal = ft / KANAL;
    let marla_pk = ft / PK_MARLA;
    let sarsai = ft / SARSAI;
    let acre = ft / ACRE;
    let hectare = ft / HECTARE;
    let donum = ft / DONUM;

    document.getElementById("ftResult").innerHTML = `
        <b>Kanal:</b> ${kanal.toFixed(4)}<br>
        <b>Marla (PK):</b> ${marla_pk.toFixed(4)}<br>
        <b>Sarsai:</b> ${sarsai.toFixed(4)}<br>
        <b>Acre:</b> ${acre.toFixed(6)}<br>
        <b>Hectare:</b> ${hectare.toFixed(6)}<br>
        <b>Donum:</b> ${donum.toFixed(4)}<br>
    `;
}

function reverseConvert(){
    let val = parseFloat(document.getElementById("unitValue").value);
    let type = document.getElementById("unitType").value;
    if (!val) return;

    let sqft = 0;

    if (type === "marla_pk") sqft = val * PK_MARLA;
    if (type === "sarsai") sqft = val * SARSAI;
    if (type === "kanal") sqft = val * KANAL;
    if (type === "acre") sqft = val * ACRE;
    if (type === "hectare") sqft = val * HECTARE;
    if (type === "donum") sqft = val * DONUM;

    document.getElementById("revResult").innerHTML = `<b>Square Feet:</b> ${sqft}`;
}
</script>

</body>
</html>
